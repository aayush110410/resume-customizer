# skill_synonyms.yaml
# Canonical skill name (lowercase) -> aliases (lowercase) that ATS keyword
# matching treats as the same keyword. Consumed by app.text_utils.contains_term:
# text is normalized (NFKC, dashes unified, lowercased) and a term is bounded by
# (?<!\w) on the left and (?![\w+#]) on the right when it starts/ends with a word
# character. A hyphen or dot after a term is NOT a boundary stop, so "node" also
# hits "3-node", "mis" hits "mis-selling" and "angular" hits "angular.js"; that is a
# matcher limitation, so aliases here avoid tokens whose hyphenated forms are common.
#
# Rules this file follows:
#   - Each alias appears under exactly one canonical and is never itself a canonical.
#   - Aliases are true equivalents (abbreviation, spelling, punctuation, rename).
#     Related-but-different skills are kept apart: github is not git, angularjs
#     is not angular, green belt is not black belt, tidyverse is not r.
#   - No common English word is used as an alias: spark, airflow, rails, torch,
#     hive, helm, tailwind, excel, bash, express, spring, swift, rust, ruby,
#     snowflake, workday, recruitment, hiring and similar words are excluded.
#   - No alias that reads as ordinary prose: "my sql" ("honed my SQL skills"),
#     "no sql" ("no SQL injection"), "business objects" (OOP/DDD layer),
#     "oracle fusion" (also Oracle Fusion Middleware) are excluded.
#   - Levels and editions are not merged: PSM I is not PSM II, AWS SA Associate is
#     not AWS SA Professional, SAP (vendor) is not SAP ECC, GA4 is not the retired
#     Universal Analytics, "advanced excel" is a proficiency claim, not MS Excel.
#   - Abbreviations left out because they have a competing meaning that is common
#     in Indian resumes or JDs:
#       go (verb), cv (resume), ts (Telangana in Hyderabad addresses),
#       gtm (Google Tag Manager), rag (RAG status reports), eda (electronic design
#       automation in VLSI), sem (semester in Indian marksheets; scanning electron
#       microscope), gan (GaN, gallium nitride, in ECE/VLSI resumes), dsa (direct
#       selling agent in BFSI), ppc (production planning and control), mrp
#       (maximum retail price), ltv (loan-to-value), nps (National Pension System),
#       cro (contract research organisation), ptp (promise to pay in collections),
#       otc (over the counter), p2p (peer-to-peer), scm (source control), csm
#       (customer success manager), plc (public limited company), iam (the "Iam"
#       typo), ror (rate of return), adf (augmented dickey-fuller test; Oracle ADF
#       framework), brs (business requirement specification; BRS party), acma
#       (Automotive Component Manufacturers Association), tfs (aliased by full name
#       only), dbt (direct
#       benefit transfer), ap (Andhra Pradesh), ar (augmented reality), ca, cs, bi,
#       pr (pull request), tf, sv, pv, spa, ui, ux.
#   - Kept despite some ambiguity because they are the usual way candidates write
#     the skill and the other meaning rarely appears in resumes for the same roles:
#     ml, dl (also driving licence), ai, node, gcp (also ICH-GCP in clinical
#     research), nlp, crm, cnn, cfd, tds, llm (also the LL.M. law degree), cpa (also
#     cost per acquisition), mis, cad, ms project.

